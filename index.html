<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 좌표 테스트 | Mind Coordinates Test</title>
    <meta name="description" content="4가지 축으로 알아보는 16가지 삶의 태도 유형 | 16 life attitude types based on 4 axes">
    <meta property="og:title" content="마음 좌표 테스트 | Mind Coordinates Test">
    <meta property="og:description" content="당신의 마음 좌표는 어디인가요? | Where are your mind coordinates?">
    <meta property="og:url" content="https://hyungkwonko.info/mbti">
    <meta property="og:type" content="website">
    <meta name="author" content="Kwon Ko (고형권)">
    <meta name="copyright" content="© Kwon Ko (고형권). All Rights Reserved.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted: #555555;
            --border-color: #1e1e1e;
            --border-color-hover: #333333;
            --accent-warm: #d4a574;
            --accent-warm-dim: rgba(212, 165, 116, 0.15);
            --gradient-gold: linear-gradient(135deg, #e8d5b7 0%, #a08060 50%, #e8d5b7 100%);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(212, 165, 116, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(212, 165, 116, 0.02) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        ::selection {
            background: rgba(212, 165, 116, 0.25);
            color: var(--text-primary);
        }

        .container {
            text-align: center;
            max-width: 460px;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-warm);
            background: var(--accent-warm-dim);
            padding: 7px 16px;
            border-radius: 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(212, 165, 116, 0.2);
            animation: fadeInUp 0.6s ease-out 0s both;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.3;
            margin-bottom: 16px;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .title-ko {
            font-size: 0.65em;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 48px;
            line-height: 1.6;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .language-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 1rem;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .lang-btn:hover {
            border-color: var(--accent-warm);
            background: var(--bg-tertiary);
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.06);
        }

        .lang-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .lang-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .lang-flag {
            font-size: 1.5rem;
            line-height: 1;
        }

        .lang-text {
            text-align: left;
        }

        .lang-name {
            font-weight: 500;
            display: block;
            margin-bottom: 2px;
        }

        .lang-native {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .lang-arrow {
            color: var(--text-muted);
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .lang-btn:hover .lang-arrow {
            color: var(--accent-warm);
            transform: translateX(3px);
        }

        .lang-status {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            letter-spacing: 0.03em;
        }

        .lang-status.available {
            color: var(--accent-warm);
            background: var(--accent-warm-dim);
            border: 1px solid rgba(212, 165, 116, 0.15);
        }

        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: var(--text-muted);
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent-warm);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="badge">Personality Test</div>
        <h1>Mind Coordinates<br><span class="title-ko">마음 좌표 테스트</span></h1>
        <p class="subtitle">
            Select your language<br>
            언어를 선택하세요
        </p>

        <div class="language-options">
            <a href="./ko/" class="lang-btn">
                <div class="lang-info">
                    <span class="lang-flag">🇰🇷</span>
                    <div class="lang-text">
                        <span class="lang-name">한국어</span>
                        <span class="lang-native">Korean</span>
                    </div>
                </div>
                <span class="lang-status available">Available</span>
            </a>

            <div class="lang-btn disabled">
                <div class="lang-info">
                    <span class="lang-flag">🇺🇸</span>
                    <div class="lang-text">
                        <span class="lang-name">English</span>
                        <span class="lang-native">영어</span>
                    </div>
                </div>
                <span class="lang-status">Coming Soon</span>
            </div>
        </div>

        <footer class="footer">
            <p>© Kwon Ko (고형권). All Rights Reserved.</p>
        </footer>
    </div>
</body>

</html>
