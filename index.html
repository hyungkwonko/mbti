<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 좌표 테스트 | Mind Coordinates Test</title>
    <meta name="description" content="4가지 축으로 알아보는 16가지 삶의 태도 유형 | 16 life attitude types based on 4 axes">
    <meta property="og:title" content="마음 좌표 테스트 | Mind Coordinates Test">
    <meta property="og:description" content="당신의 마음 좌표는 어디인가요? | Where are your mind coordinates?">
    <meta property="og:url" content="https://hyungkwonko.info/mbti">
    <meta property="og:type" content="website">
    <meta name="author" content="Kwon Ko (고형권)">
    <meta name="copyright" content="© Kwon Ko (고형권). All Rights Reserved.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --text-muted: #555555;
            --border-color: #222222;
            --accent-primary: #ffffff;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.3;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 48px;
            line-height: 1.6;
        }

        .language-options {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 1rem;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .lang-btn:hover {
            border-color: var(--text-muted);
            background: var(--bg-tertiary);
        }

        .lang-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .lang-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-flag {
            font-size: 1.5rem;
        }

        .lang-text {
            text-align: left;
        }

        .lang-name {
            font-weight: 500;
            display: block;
        }

        .lang-native {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .lang-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 12px;
        }

        .lang-status.available {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer a:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="badge">Personality Test</div>
        <h1>마음 좌표 테스트</h1>
        <p class="subtitle">
            Select your language<br>
            언어를 선택하세요
        </p>

        <div class="language-options">
            <a href="./ko/" class="lang-btn">
                <div class="lang-info">
                    <span class="lang-flag">🇰🇷</span>
                    <div class="lang-text">
                        <span class="lang-name">한국어</span>
                        <span class="lang-native">Korean</span>
                    </div>
                </div>
                <span class="lang-status available">Available</span>
            </a>

            <div class="lang-btn disabled">
                <div class="lang-info">
                    <span class="lang-flag">🇺🇸</span>
                    <div class="lang-text">
                        <span class="lang-name">English</span>
                        <span class="lang-native">영어</span>
                    </div>
                </div>
                <span class="lang-status">Coming Soon</span>
            </div>
        </div>

        <footer class="footer">
            <p>© Kwon Ko (고형권). All Rights Reserved.</p>
        </footer>
    </div>
</body>

</html>
